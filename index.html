<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWS CLF 用語トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F5; --sheet:#FFFFFF; --ink:#16233A; --sub:#55627A; --line:#C9D1DB;
  --mark:#2547D0; --markbg:#E6EBFB; --ok:#1B7F54; --okbg:#E3F3EB; --ng:#BE3434; --ngbg:#FBE9E9; --hint:#F6EFD9;
  --btnfg:#FFFFFF; --font:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101826; --sheet:#182235; --ink:#E7ECF4; --sub:#9AA8BF; --line:#2F3C55;
    --mark:#8BA2FF; --btnfg:#0E1630; --markbg:#222F57; --ok:#5FD39C; --okbg:#143427; --ng:#FF8A8A; --ngbg:#3A1E22; --hint:#33301F;
  }
}
:root[data-theme="dark"]{
  --paper:#101826; --sheet:#182235; --ink:#E7ECF4; --sub:#9AA8BF; --line:#2F3C55;
  --mark:#8BA2FF; --btnfg:#0E1630; --markbg:#222F57; --ok:#5FD39C; --okbg:#143427; --ng:#FF8A8A; --ngbg:#3A1E22; --hint:#33301F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:700}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.lead{color:var(--sub);margin:0 0 20px;font-size:14px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:700;font-size:14px;margin-bottom:6px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--paper);min-height:36px;display:inline-flex;align-items:center}
.seg input:checked+label{background:var(--markbg);border-color:var(--mark);color:var(--mark);font-weight:700}
.seg input:focus-visible+label{outline:3px solid var(--mark);outline-offset:2px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--mark);background:var(--mark);color:var(--btnfg);border-radius:4px;padding:10px 22px;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--mark)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.link{background:none;border:0;color:var(--mark);text-decoration:underline;cursor:pointer;padding:6px 2px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:12px;color:var(--sub)}
.weak{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.weak li{border-top:1px solid var(--line);padding:6px 0;display:flex;justify-content:space-between;gap:10px}
.weak small{color:var(--sub);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--mark)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:10px}
.q{font-size:17px;font-weight:700;margin:0 0 10px}
.quote{background:var(--hint);border-left:4px solid var(--sub);padding:10px 12px;margin:0 0 14px;border-radius:2px;font-size:15px}
.opts{display:grid;gap:8px;margin:0 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;min-height:48px}
.opt .bub{flex:0 0 28px;height:28px;border:2px solid var(--sub);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub);margin-top:1px}
.opt .tx{flex:1;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--mark)}
.opt.sel .bub{background:var(--mark);border-color:var(--mark);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt.ng .bub{background:var(--ng);border-color:var(--ng);color:#fff}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;font-size:17px;margin:0 0 8px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 10px;background:var(--sheet)}
.card h3{font-size:15px;margin:0 0 6px}
.card .par{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.card dl{margin:0;display:grid;grid-template-columns:9.5em 1fr;gap:4px 10px;font-size:14px}
.card dt{color:var(--sub);font-weight:700}
.card dd{margin:0}
.card.pick{border-color:var(--ng)}
.card.right{border-color:var(--ok)}
.score{font-size:40px;font-weight:700;line-height:1.1;margin:0 0 4px}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);width:min(560px,92vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
textarea{width:100%;min-height:160px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}
.note{font-size:12px;color:var(--sub);margin:6px 0 0}

.modes{display:grid;gap:8px}
.modes input{position:absolute;opacity:0;pointer-events:none}
.modes label{display:block;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--paper)}
.modes label b{display:block;font-size:15px}
.modes label span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.modes input:checked+label{background:var(--markbg);border-color:var(--mark)}
.modes input:checked+label b{color:var(--mark)}
.modes input:focus-visible+label{outline:3px solid var(--mark);outline-offset:2px}
.grp{border-top:1px solid var(--line);padding:10px 0 4px}
.gh{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.item{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0 26px;cursor:pointer;font-size:14px}
.item small{display:block;color:var(--sub);font-size:12px;line-height:1.5}
.grp input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--mark);flex:0 0 auto}
.cnt{color:var(--sub);font-size:12px;margin-left:6px;font-weight:400}
.sum{font-size:13px;color:var(--sub);margin:8px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:1px 8px;color:var(--sub);background:var(--paper)}
.weak li span small{white-space:normal;display:inline}
.weak li{align-items:flex-start}
details{margin-top:6px}
summary{cursor:pointer;padding:4px 0}
.hintline{font-size:13px;color:var(--sub);margin:8px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
@media (max-width:480px){.card dl{grid-template-columns:1fr}.card dt{margin-top:4px}}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"><h2 id="dlgT"></h2><p class="note" id="dlgN"></p><textarea id="dlgTa" aria-label="データ"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="dlgOk" type="button"></button><button class="btn ghost" id="dlgNo" type="button">閉じる</button></div></dialog>
<script>
const DATA = [{"s": "D1_概念", "l": 0, "p": "クラウドの利点(6つ)", "t": "固定費から変動費へ", "d": "先に設備へ投資せず、使った分だけ支払う形に変わる", "k": "「初期投資が不要」「設備投資を避ける」「使った分だけ」", "b": "スケールメリット=単価が下がる話。こちらは支払い方の話", "st": 0, "q": "設備を先に買って固定費として払うのではなく、使った分だけを後から支払う形に変わる、というクラウドの利点です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの利点(6つ)", "t": "スケールメリット(規模の経済)", "d": "AWSが大量に調達・運用するため、利用者の単価が下がる", "k": "「単価が下がる」「大量利用による値下げ」", "b": "固定費から変動費へ=支払い方。こちらは価格の水準", "st": 0, "q": "AWSが世界中の利用者分をまとめて調達・運用するため、利用者が払う単価が下がっていく、というクラウドの利点です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの利点(6つ)", "t": "キャパシティの推測が不要", "d": "必要量を事前に見積もらず、需要に合わせて増減できる", "k": "「需要予測が難しい」「過剰設備や不足を避ける」、「必要なときに必要な量だけ」", "b": "俊敏性=用意する速さ。こちらは量を見積もらなくてよいこと", "st": 0, "q": "必要な処理能力を事前に見積もって買う必要がなく、需要に合わせて増やしたり減らしたりできる、というクラウドの利点です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの利点(6つ)", "t": "スピードと俊敏性", "d": "新しい環境を数分で用意でき、試行錯誤が速くなる", "k": "「数分で用意」「すぐ試す」「リードタイム短縮」「イノベーション」、「物理調達せず短期間で公開」「AWSリージョンへデプロイ」", "b": "伸縮性=量の自動調整。俊敏性=速さ", "st": 0, "q": "サーバーなどの環境を数分で用意できるので、新しいことをすぐ試せて、変更も素早くできる、というクラウドの利点です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの利点(6つ)", "t": "データセンター運用費の削減", "d": "ラック・電源・空調などの物理運用をAWSに任せ、本業に集中できる", "k": "「施設費を減らす」「物理インフラの維持」「差別化につながらない作業」、「自社データセンターの維持費」「物理インフラの保護をAWSへ移管」", "b": "責任共有モデルで物理保護がAWS側になることと対応", "st": 0, "q": "ラック・電源・空調といった物理設備の維持をAWSに任せることで、自社のコストと手間を減らし、本業に集中できる、というクラウドの利点です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの利点(6つ)", "t": "数分でグローバル展開", "d": "世界中のリージョンへ、短時間でシステムを展開できる", "k": "「海外の利用者」「遅延を下げる」「近い地域へ展開」、「グローバルな規模」「グローバルリーチ」「地理的分散」", "b": "高可用性=止まらないこと。こちらは距離と遅延の話", "st": 0, "q": "世界中のリージョンへ短時間でシステムを展開でき、海外の利用者にも近い場所からサービスを提供できる、というクラウドの利点です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの形態(提供モデル)", "t": "IaaS (Infrastructure as a Service)", "d": "サーバー・ネットワーク等のインフラを借りる。OS以上は利用者が管理", "k": "「OSを利用者が管理」「仮想マシン」(例: EC2)", "b": "PaaS=OSまで事業者に任せる", "st": 1, "q": "サーバーやネットワークなどのインフラを借りて使うクラウドの形態です。OSより上は、利用者自身が管理します。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの形態(提供モデル)", "t": "PaaS (Platform as a Service)", "d": "OS・ミドルウェアまで事業者が管理し、利用者はアプリ開発に集中", "k": "「アプリ開発に集中」「OSやミドルウェアを任せる」(例: Elastic Beanstalk)", "b": "IaaS=OSを自分で管理。SaaS=アプリまで完成品", "st": 1, "q": "OSやミドルウェアまで事業者が管理してくれるので、利用者はアプリの開発に集中できるクラウドの形態です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの形態(提供モデル)", "t": "SaaS (Software as a Service)", "d": "完成したアプリを、そのまま利用する", "k": "「ソフトウェアをそのまま使う」「インストール不要」(例: Amazon Connect)", "b": "PaaS=アプリは自分で作る", "st": 1, "q": "完成したソフトウェアを、インストールせずにそのまま利用するクラウドの形態です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの形態(配置モデル)", "t": "パブリッククラウド", "d": "事業者の設備を、多数の利用者で共有して使う", "k": "「事業者の設備」「インターネット経由」", "b": "プライベート=自社設備", "st": 0, "q": "事業者が用意した設備を、多数の利用者で共有して使うクラウドの形態です。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの形態(配置モデル)", "t": "プライベートクラウド(オンプレミス)", "d": "自社の設備で、クラウド的な基盤を運用する", "k": "「自社データセンター」", "b": "パブリッククラウドと対になる概念", "st": 0, "q": "自社の設備の中で、クラウドのような基盤を運用する形態です。オンプレミスとも呼ばれます。"}, {"s": "D1_概念", "l": 0, "p": "クラウドの形態(配置モデル)", "t": "ハイブリッド", "d": "オンプレミスとクラウドを連携させて併用する", "k": "「オンプレミスとAWSを一体で運用」「二つの環境を統合」(例: Outposts、Direct Connect)", "b": "マルチクラウド=複数のクラウド事業者を併用", "st": 0, "q": "自社のオンプレミス環境とクラウドをつなぎ、一体のものとして併用する形態です。"}, {"s": "D1_概念", "l": 0, "p": "経済性", "t": "CapEx (Capital Expenditure) / OpEx (Operational Expenditure)", "d": "CapEx=設備への先行投資、OpEx=使った分の運用費。クラウドはOpEx寄り", "k": "「先行投資」「運用支出」", "b": "固定費から変動費へ(利点)と同じ話", "st": 0, "q": "設備への先行投資(資本的支出)と、使った分の運用費(運用支出)という、お金の使い方を表す2つの用語です。クラウドは後者に近い形です。"}, {"s": "D1_概念", "l": 0, "p": "経済性", "t": "TCO (Total Cost of Ownership)", "d": "購入から運用・保守・廃棄までの総コスト", "k": "「総保有コスト」「オンプレミスとの比較」(Migration Evaluator)", "b": "Pricing Calculator=AWS構成の月額見積もり", "st": 0, "q": "機器の購入から、運用、保守、廃棄までにかかる総コストのことです。オンプレミスとクラウドの比較などに使います。"}, {"s": "D1_概念", "l": 0, "p": "経済性", "t": "従量課金", "d": "使用した量に応じて支払う", "k": "「使用量に応じて」「前払い不要」、「使用したリソース量に応じて支払う」", "b": "リザーブド等=長期の約束で割り引く", "st": 0, "q": "使った量に応じて料金を支払う仕組みで、先に大きな費用を払う必要がありません。"}, {"s": "D1_概念", "l": 0, "p": "設計の原則", "t": "AWS Well-Architected Framework", "d": "AWS推奨の設計の考え方を、6本の柱で整理したもの", "k": "「ベストプラクティス」「6本の柱」「設計のレビュー」", "b": "CAF=組織のクラウド導入の指針。WA=システム設計の指針", "st": 1, "q": "AWSが推奨する、システム設計のベストプラクティスを ernance perspective", "t": "Data curation", "d": "データキュレーション。データを整理・カタログ化し、使える状態にする", "k": "「データカタログ」「データの整理」", "b": "Data engineering(Platform)=処理基盤を作る", "st": 0, "q": "CAFのガバナンス視点の能力で、データを整理してカタログ化し、使える状態に保つことです。"}, {"s": "D1_CAF", "l": 1, "p": "AWS CAF", "t": "Platform perspective", "d": "プラットフォーム視点。クラウド基盤とアプリ・データの技術基盤を設計・構築する", "k": "「アーキテクチャ」「CI/CD」「自動構築」「データ基盤」", "b": "運用はOperations視点", "st": 0, "q": "クラウド基盤と、アプリやデータの技術基盤を、設計・構築することに焦点を当てた、CAFの視点です。"}, {"s": "D1_CAF", "l": 3, "p": "Platform perspective", "t": "Platform architecture", "d": "プラットフォーム設計。クラウド基盤全体の設計原則・標準を定める", "k": "「基盤の設計」", "b": "Platform engineering=実際に構築する", "st": 0, "q": "CAFのプラットフォーム視点の能力で、クラウド基盤全体の設計方針や標準を定めることです。"}, {"s": "D1_CAF", "l": 3, "p": "Platform perspective", "t": "Data architecture", "d": "データアーキテクチャ。データ基盤(データレイク等)を設計する", "k": "「データ基盤の設計」", "b": "Data governance(Governance)=ルール", "st": 0, "q": "CAFのプラットフォーム視点の能力で、データレイクなどのデータ基盤を設計することです。"}, {"s": "D1_CAF", "l": 3, "p": "Platform perspective", "t": "Platform engineering", "d": "プラットフォームエンジニアリング。再利用できる共通基盤を構築する", "k": "「共通基盤」", "b": "Platform architecture=設計", "st": 0, "q": "CAFのプラットフォーム視点の能力で、再利用できる共通の基盤を構築することです。"}, {"s": "D1_CAF", "l": 3, "p": "Platform perspective", "t": "Data engineering", "d": "データエンジニアリング。データを取り込み・加工する処理基盤を作る", "k": "「データパイプライン」", "b": "Data science(Business)=データを使う側", "st": 0, "q": "CAFのプラットフォーム視点の能力で、データを取り込んで加工する処理基盤を作ることです。"}, {"s": "D1_CAF", "l": 3, "p": "Platform perspective", "t": "Provisioning and orchestration", "d": "プロビジョニングとオーケストレーション。環境を自動で構築・展開する", "k": "「自動構築」「IaC」", "b": "CI/CD=アプリのビルド・デプロイ", "st": 0, "q": "CAFのプラットフォーム視点の能力で、環境を自動で構築し、展開することです。"}, {"s": "D1_CAF", "l": 3, "p": "Platform perspective", "t": "Modern application development", "d": "モダンアプリケーション開発。マイクロサービスやサーバーレスで開発する", "k": "「マイクロサービス」「サーバーレス」", "b": "Application security(Security)=開発時の安全", "st": 0, "q": "CAFのプラットフォーム視点の能力で、マイクロサービスやサーバーレスなど、クラウド向けの方法でアプリを開発することです。"}, {"s": "D1_CAF", "l": 3, "p": "Platform perspective", "t": "Cont ", "t": "Data protection", "d": "データ保護。暗号化等で、保存中・転送中のデータを守る", "k": "「暗号化」「データ保護」", "b": "Data governance(Governance)=管理ルール", "st": 0, "q": "CAFのセキュリティ視点の能力で、暗号化などによって、保存中や転送中のデータを守ることです。"}, {"s": "D1_CAF", "l": 3, "p": "Security perspective", "t": "Application security", "d": "アプリケーションセキュリティ。開発段階から脆弱性を作り込まない", "k": "「開発時のセキュリティ」", "b": "Modern application development(Platform)", "st": 0, "q": "CAFのセキュリティ視点の能力で、アプリの開発段階から、脆弱性を作り込まないようにすることです。"}, {"s": "D1_CAF", "l": 3, "p": "Security perspective", "t": "Incident response", "d": "インシデント対応。セキュリティ事故に備え、対応・復旧する", "k": "「セキュリティインシデント」", "b": "Incident and problem management(Operations)=運用上の障害", "st": 0, "q": "CAFのセキュリティ視点の能力で、セキュリティ事故に備えて、発生時に対応・復旧することです。"}, {"s": "D1_CAF", "l": 1, "p": "AWS CAF", "t": "Operations perspective", "d": "運用視点。クラウド上のワークロードを、合意した水準で安定運用する", "k": "「監視」「障害対応」「パッチ」「容量」「変更管理」", "b": "CI/CD=Platform視点。問題集の「batch management」は公式一覧で未確認(Xxx)", "st": 0, "q": "クラウド上のワークロードを、合意した水準で安定して運用することに焦点を当てた、CAFの視点です。"}, {"s": "D1_CAF", "l": 3, "p": "Operations perspective", "t": "Observability", "d": "可観測性。メトリクス・ログ・トレースで状態を把握する", "k": "「可観測性」「監視」", "b": "Event management=検知後の対応", "st": 0, "q": "CAFの運用視点の能力で、メトリクスやログなどから、システムの状態を把握できるようにすることです。"}, {"s": "D1_CAF", "l": 3, "p": "Operations perspective", "t": "Event management (AIOps)", "d": "イベント管理。イベントを検知し、対応を自動化する(AIOps: Artificial Intelligence for IT Operations)", "k": "「イベント検知」「AIによる運用」", "b": "Observability=状態の把握", "st": 0, "q": "CAFの運用視点の能力で、イベントを検知し、対応を自動化することです。AIOpsとも呼ばれます。"}, {"s": "D1_CAF", "l": 3, "p": "Operations perspective", "t": "Incident and problem management", "d": "インシデント・問題管理。障害を復旧し、根本原因を解消する", "k": "「障害対応」「再発防止」", "b": "Incident response(Security)=セキュリティ事故", "st": 0, "q": "CAFの運用視点の能力で、障害から復旧し、その根本原因を取り除いて再発を防ぐことです。"}, {"s": "D1_CAF", "l": 3, "p": "Operations perspective", "t": "Change and release management", "d": "変更・リリース管理。変更を安全に本番へ反映する", "k": "「変更管理」「リリース」", "b": "CI/CD(Platform)=仕組みづくり", "st": 0, "q": "CAFの運用視点の能力で、システムの変更を、安全に本番へ反映することです。" 繰り返しながら、ビジネスの価値を届け続けることを重視する、Well-Architectedの柱です。"}, {"s": "D1_Well-Architected", "l": 3, "p": "運用上の優秀性", "t": "運用をコードとして実行する", "d": "手作業の運用をスクリプトやテンプレートにして、ミスを減らす", "k": "「運用のコード化」", "b": "セキュリティの「ベストプラクティスを自動化」", "st": 0, "q": "運用上の優秀性の設計原則で、手作業の運用をスクリプトやテンプレートにして、ミスを減らすことです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "運用上の優秀性", "t": "頻繁で小さな、元に戻せる変更を行う", "d": "小さく変更し、問題があればすぐ戻せるようにする", "k": "「小さな変更」「ロールバック」", "b": "信頼性の「自動化で変更を管理する」", "st": 0, "q": "運用上の優秀性の設計原則で、変更を小さく分け、問題があればすぐに元へ戻せるようにすることです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "運用上の優秀性", "t": "運用手順を頻繁に改善する", "d": "運用手順を定期的に見直して、改善する", "k": "「手順の見直し」", "b": "信頼性の「復旧手順をテストする」", "st": 0, "q": "運用上の優秀性の設計原則で、運用の手順を定期的に見直して、よりよくしていくことです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "運用上の優秀性", "t": "障害を予測する", "d": "起こり得る障害を事前に洗い出し、テストしておく", "k": "「障害を想定」「事前の検証」", "b": "信頼性の「障害から自動的に復旧する」=起きた後", "st": 0, "q": "運用上の優秀性の設計原則で、起こり得る障害を事前に洗い出して、テストしておくことです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "運用上の優秀性", "t": "運用上のすべての障害から学ぶ", "d": "障害事例を共有し、再発を防ぐ", "k": "「障害から学ぶ」「振り返り」", "b": "—", "st": 0, "q": "運用上の優秀性の設計原則で、障害の事例を共有して、再発を防ぐことです。"}, {"s": "D1_Well-Architected", "l": 1, "p": "6本の柱", "t": "セキュリティ (Security)", "d": "データ・システム・資産を守りながら、ビジネス価値を届ける", "k": "「アクセス管理」「追跡」「暗号化」「多層防御」", "b": "信頼性=止まらないこと", "st": 0, "q": "データやシステムを守りながら、ビジネスの価値を届けることを重視する、Well-Architectedの柱です。"}, {"s": "D1_Well-Architected", "l": 3, "p": "セキュリティ", "t": "強力なアイデンティティ基盤を実装する", "d": "最小権限と権限の一元管理を徹底し、長期の認証情報を減らす", "k": "「最小権限」「権限の一元管理」", "b": "—", "st": 0, "q": "セキュリティの設計原則で、最小権限を徹底し、権限を一元管理して、長期の認証情報を減らすことです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "セキュリティ", "t": "追跡可能性を維持する", "d": "操作や変更をログで記録し、監視・監査できるようにする", "k": "「追跡可能性」「ログ」「監査」", "b": "—", "st": 0, "q": "セキュリティの設計原則で、操作や変更をログに記録して、監視や監査ができるようにすることです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "セキュリティ", "t": "全レイヤーでセキュリティを適用する", "d": "ネットワーク・インスタンス・アプリ等、各層で防御する(多層防御)", "k": "「全レイヤー」「多層防御」", "b": "—", "st": 0, "q": "セキュリティの設計原則で、ネットワーク・サーバー・アプリなど、各層で防御を重ねる(多層防御)ことです。"}, cted", "l": 3, "p": "信頼性", "t": "自動化で変更を管理する", "d": "インフラの変更を自動化で行い、追跡できるようにする", "k": "「変更の自動化」", "b": "運用上の優秀性の「小さな変更」", "st": 0, "q": "信頼性の設計原則で、インフラの変更を自動化して行い、追跡できるようにすることです。"}, {"s": "D1_Well-Architected", "l": 1, "p": "6本の柱", "t": "パフォーマンス効率 (Performance Efficiency)", "d": "要件に合うリソースを選び、効率よく使い続ける", "k": "「最適なリソース選択」「計算資源を効率よく割り当て」", "b": "コスト最適化=費用を減らすこと", "st": 0, "q": "要件に合ったリソースを選び、効率よく使い続けることを重視する、Well-Architectedの柱です。"}, {"s": "D1_Well-Architected", "l": 3, "p": "パフォーマンス効率", "t": "高度なテクノロジーを民主化する", "d": "機械学習等の高度な技術を、マネージドサービスとして使う(自前で抱えない)", "k": "「先端技術をサービスとして利用」、「先端技術を標準化して利用」", "b": "—", "st": 0, "q": "パフォーマンス効率の設計原則で、機械学習などの高度な技術を、自前で抱えず、サービスとして利用することです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "パフォーマンス効率", "t": "数分でグローバルに展開する", "d": "複数リージョンへ展開し、利用者に近い場所から提供する", "k": "「グローバル展開」「低遅延」", "b": "—", "st": 0, "q": "パフォーマンス効率の設計原則で、複数のリージョンへ展開して、利用者に近い場所から提供することです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "パフォーマンス効率", "t": "サーバーレスアーキテクチャを使う", "d": "サーバー管理をなくし、運用負荷を下げる", "k": "「サーバーレス」", "b": "—", "st": 0, "q": "パフォーマンス効率の設計原則で、サーバーの管理をなくして、運用の負荷を下げることです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "パフォーマンス効率", "t": "頻繁に実験する", "d": "構成を比較・試験しやすいので、何度も試す", "k": "「実験」「比較テスト」", "b": "—", "st": 0, "q": "パフォーマンス効率の設計原則で、構成を比較・試験しやすいので、何度も試して最適な構成を探すことです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "パフォーマンス効率", "t": "メカニカルシンパシー", "d": "目的に最も合う技術やデータアクセス方法を選ぶ", "k": "「用途に合う技術を選ぶ」", "b": "—", "st": 0, "q": "パフォーマンス効率の設計原則で、目的に最も合う技術やデータアクセスの方法を選ぶことです。"}, {"s": "D1_Well-Architected", "l": 1, "p": "6本の柱", "t": "コスト最適化 (Cost Optimization)", "d": "不要な費用を避け、最小のコストでビジネス価値を届ける", "k": "「無駄な費用の削減」「消費モデル」", "b": "パフォーマンス効率=性能を効率よく出すこと", "st": 0, "q": "不要な費用を避けながら、最小のコストでビジネスの価値を届けることを重視する、Well-Architectedの柱です。"}, {"s": "D1_Well-Architected", "l": 3, "p": "コスト最適化", "t": "クラウド財務管理を実装する", "d": "コスト管理の体制とプロセスを整える", "k": "「財務管理」「FinOps」", "b": "CAFのGovernance視点にも同名の能力", "st": 0, "q": "コスト最適化の設計原則で、コストを管理する体制とプロセスを整えることです。"}, {"s": "D1_Well-Architected", "l": 3, "p": "コス 性を見つける側", "st": 0, "q": "Systems Managerの機能で、複数のEC2のOSへのパッチ適用を自動化します。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "セキュリティグループ (Security Group)", "d": "インスタンス単位の仮想ファイアウォール。ステートフル(戻りの通信は自動で許可)、許可ルールのみ", "k": "「インスタンス単位」「許可のみ」「ステートフル」", "b": "ネットワークACL=サブネット単位で拒否も可能", "st": 1, "q": "インスタンス単位で働く、仮想のファイアウォールです。ステートフルで、許可のルールだけを書けます。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "ネットワークACL (Access Control List)", "d": "サブネット単位のファイアウォール。ステートレス、許可と拒否のルール", "k": "「サブネット境界」「明示的に拒否」「特定IPを拒否」", "b": "セキュリティグループ=拒否ルールなし", "st": 1, "q": "サブネット単位で働くファイアウォールです。ステートレスで、許可と拒否の両方のルールを書けます。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "AWS WAF (Web Application Firewall)", "d": "HTTP(S)リクエストを、Web ACLのルール(IP・国・ヘッダー・SQLインジェクション等)で検査して遮断する(L7)", "k": "「SQLインジェクション」「特定のIP・国を遮断」「HTTPヘッダー」、「L7のフィルタリング」「Web ACL」「HTTP条件」「地理条件(国)」", "b": "Shield=DDoS対策(L3/L4中心)", "st": 0, "q": "HTTP(S)のリクエストを、IPや国、ヘッダー、SQLインジェクションなどの条件で検査して、遮断するWebアプリ向けのファイアウォールです。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "AWS Shield", "d": "DDoS (Distributed Denial of Service) 攻撃への対策", "k": "「DDoS」、「L3/L4の保護」", "b": "WAF=Webアプリ層の攻撃", "st": 0, "q": "DDoS攻撃から、AWS上のアプリを守るサービスです。"}, {"s": "D2_防御・暗号化", "l": 3, "p": "AWS Shield", "t": "Shield Standard", "d": "全利用者に追加料金なしで自動適用される、基本的なDDoS保護", "k": "「追加料金なし」「自動で保護」", "b": "—", "st": 0, "q": "AWS Shieldの標準版で、追加料金なしで、すべての利用者に自動で適用されます。"}, {"s": "D2_防御・暗号化", "l": 3, "p": "AWS Shield", "t": "Shield Advanced", "d": "有料。高度なDDoS防御、攻撃中の専門チーム支援、可視化、コスト保護", "k": "「専門支援」「高度なDDoS防御」", "b": "—", "st": 0, "q": "AWS Shieldの有料版で、高度なDDoS対策に加え、攻撃中の専門チームの支援を受けられます。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "AWS KMS (Key Management Service)", "d": "暗号鍵の作成・管理。各サービスの保存データの暗号化に使う", "k": "「暗号鍵の管理」「保存データの暗号化」", "b": "CloudHSM=お客様専用のハードウェア", "st": 0, "q": "暗号鍵を作成して管理するサービスです。各サービスで保存データを暗号化するときの鍵として使われます。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "AWS CloudHSM (Hardware Security Module)", "d": "お客様専用(シングルテナント)のハードウェアで暗号鍵を管理する", "k": "「専用HSM」「シングルテナント」「お客様が鍵を完全に管理」", "b": "KMS=マネージドで手軽", "st": 0, "q": "お客様専用(シングルテナント)のハードウェアで、暗号鍵を管理できるサービスです。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "ACM (AWS Certificate Manager)", "d": "SSL/TLS (Secure Sockets Layer / Transport Layer Security) 証明書の発行・配備・自動更新", "k": "「証明書」「HTTPS」「自動更新」", "b": "KMS=暗号鍵。Secrets Manager=パスワード等", "st": 0, "q": "SSL/TLS証明書を発行して、自動更新も行うサービスです。HTTPSの通信に使います。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "AWS Secrets Manager", "d": "DBパスワードやAPIキー等を保管し、自動でローテーションする", "k": "「認証情報の保管」「自動ローテーション」", "b": "Parameter Store=設定値の保管(自動ローテーションなし)。KMS=鍵", "st": 0, "q": "データベースのパスワードやAPIキーなどを保管し、自動でローテーション(更新)できるサービスです。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "AWS Firewall Manager", "d": "複数アカウントのWAF・Shield・セキュリティグループ等のルールを一元管理する", "k": "「組織全体のファイアウォール規則」", "b": "WAF=個々のルール", "st": 0, "q": "複数のアカウントにまたがる、WAFやShield、セキュリティグループなどのルールを、一元管理するサービスです。"}, {"s": "D2_防御・暗号化", "l": 2, "p": "", "t": "AWS Network Firewall", "d": "VPCに置くマネージドなネットワーク型ファイアウォール。通信を検査・フィルタリング", "k": "「VPC全体の通信を検査」", "b": "WAF=HTTPのみ。SG・NACL=単純なルール", "st": 0, "q": "VPCの境界に置く、マネージドなネットワーク型のファイアウォールです。通信を検査してフィルタリングします。"}, {"s": "D2_防御・暗号化", "l": 3, "p": "AWS WAF", "t": "Web ACL (Web Access Control List)", "d": "WAFのルールの集まり。CloudFront・ALB等に関連付ける", "k": "「Web ACL」", "b": "ネットワークACLとは別物", "st": 0, "q": "AWS WAFで、検査と遮断のルールをまとめたセットです。CloudFrontやALBに関連付けて使います。"}, {"s": "D2_コンプライアンス", "l": 2, "p": "", "t": "AWS Artifact", "d": "AWS自身の監査報告書(SOC、ISO、PCI等)や契約を、セルフサービスで取得する", "k": "「監査レポート」「コンプライアンスレポート」「SOCレポート」", "b": "Audit Manager=自社の監査証拠を集める", "st": 0, "q": "AWS自身の監査報告書(SOC、ISO、PCIなど)や契約書を、セルフサービスでダウンロードできるサービスです。"}, {"s": "D2_コンプライアンス", "l": 2, "p": "", "t": "AWS Audit Manager", "d": "自社のAWS利用に関する監査の証拠収集を、継続的に自動化する", "k": "「証拠収集」「監査準備」", "b": "Artifact=AWS自身の報告書", "st": 0, "q": "自社のAWS利用に関する監査の証拠収集を、継続的に自動化するサービスです。"}, {"s": "D2_コンプライアンス", "l": 2, "p": "", "t": "AWS Compliance Program", "d": "AWSが取得している認証・準拠の総称。ISO (International Organization for Standardization)、SOC (System and Organization Controls)、PCI DSS (Payment Card Industry Data Security Standard) 等", "k": "「AWSが取得した認証」", "b": "Artifact=その報告書を入手する場所", "st": 0, "q": "AWSが取得している、ISOやSOC、PCI DSSなどの認証や準拠の取り組みの総称です。"}, {"s": "D2_コンプライアンス", "l": 2, "p": "", "t": "AWS Abuse", "d": "AWSリソースが不正利用(スパム・攻撃)されている場合の報告窓口", "k": "「不正利用の報告」", "b": "AUP=禁止行為のルール", "st": 0, "q": "AWSのリソースが、スパムや攻撃などの不正な利用をされていると気付いたときに、報告する窓口です。"}, {"s": "D2_コンプライアンス", "l": 2, "p": "", "t": "AWS Acceptable Use Policy (AUP)", "d": "AWSの利用で禁止される行為を定めた方針", "k": "「禁止される利用方法」", "b": "AWS Abuse=違反の報告窓口", "st": 0, "q": "AWSを利用するときに禁止されている行為を定めた方針です。"}, {"s": "D3_グローバルインフラ", "l": 1, "p": "リージョン", "t": "リージョン (Region)", "d": "世界各地の地理的なエリア。複数のAZで構成され、リージョン同士は独立", "k": "「リージョン全体の障害」「データの保存場所」「法規制」", "b": "AZ=リージョン内の区画", "st": 0, "q": "世界各地にある地理的なエリアです。複数のAZで構成され、リージョン同士は互いに独立しています。"}, {"s": "D3_グローバルインフラ", "l": 1, "p": "リージョン", "t": "アベイラビリティゾーン (AZ: Availability Zone)", "d": "リージョン内の、電源・ネットワークが独立したデータセンター群", "k": "「同一リージョン内で冗長化」「AZ障害」、「複数AZへ配置(低コストで高可用)」", "b": "リージョン=より大きな単位。エッジ=配信拠点", "st": 1, "q": "1つのリージョンの中にある、電源やネットワークが独立したデータセンター群です。複数に分けて配置すると、障害に強くなります。"}, {"s": "D3_グローバルインフラ", "l": 1, "p": "別系統", "t": "エッジロケーション (Edge Location)", "d": "CloudFrontやRoute 53が使う、利用者に近い配信拠点。AZより数が多い", "k": "「キャッシュ」「CDN」「利用者の近く」", "b": "Local Zones=計算資源を置く拠点", "st": 1, "q": "CloudFrontなどが、コンテンツのキャッシュを置いて配信するための、利用者に近い拠点です。リージョンやAZとは別の仕組みです。"}, {"s": "D3_グローバルインフラ", "l": 1, "p": "別系統", "t": "AWS Local Zones", "d": "大都市圏の近くに、EC2などの計算・ストレージを置く拠点", "k": "「大都市圏」「エンドユーザーの近くで計算」、「メトロ圏」", "b": "Wavelength=5G網の中", "st": 1, "q": "大都市圏の近くに、EC2やストレージなどの計算資源を置いて、低遅延で使えるようにするAWSの拠点です。"}, {"s": "D3_グローバルインフラ", "l": 1, "p": "別系統", "t": "AWS Wavelength", "d": "通信事業者の5Gネットワーク内に、AWSの計算資源を置く", "k": "「5G」「モバイル端末向けの超低遅延」", "b": "Local Zones=大都市圏", "st": 1, "q": "通信事業者の5Gネットワークの中に、AWSの計算資源を置くことで、モバイル端末向けに超低遅延を実現する仕組みです。"}, {"s": "D3_グローバルインフラ", "l": 1, "p": "別系統", "t": "AWS Outposts", "d": "AWSのハードウェアを自社拠点に設置し、オンプレミスでAWSサービスを使う", "k": "「自社拠点でAWS」「工場内で実行」「オンプレミスでRDS」", "b": "Local Zones=AWSが設置する拠点", "st": 0, "q": "AWSのハードウェアを自社の拠点に設置して、オンプレミスでAWSのサービスを使えるようにする仕組みです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon EC2 (Elastic Compute Cloud)", "d": "仮想サーバー。OS以上を利用者が管理する(IaaS)", "k": "「仮想マシン」「OSへアクセス」「ゲストOSを管理」", "b": "Lambda=サーバー管理なし。Lightsail=簡易版", "st": 1, "q": "仮想のサーバーを、数分で用意して使えるサービスです。OSへアクセスでき、OSより上は利用者が管理します。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2", "t": "インスタンスタイプ", "d": "CPU・メモリ等の組み合わせの種類", "k": "「サイズを選ぶ」", "b": "ファミリーの違いはD3_EC2・EBS・DB補足", "st": 0, "q": "EC2のCPUやメモリなどの組み合わせを、サイズごとに分けた種類です。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2", "t": "AMI (Amazon Machine Image)", "d": "OS・設定・ソフトを含む、EC2の起動用イメージ", "k": "「同じ構成で起動」「イメージ化」「OSテンプレート」", "b": "スナップショット=EBSのバックアップ。起動テンプレート=起動時の設定", "st": 1, "q": "OSや設定、ソフトウェアを含む、EC2を起動するためのイメージ(テンプレート)です。同じ構成のサーバーを、何台も起動できます。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2", "t": "EC2キーペア", "d": "OSへのSSH (Secure Shell) 接続(Windowsはパスワード取得)に使う公開鍵・秘密鍵", "k": "「SSH」「OSレベルで接続」、「お客様が管理する認証情報」", "b": "アクセスキー=AWS APIへの認証", "st": 1, "q": "EC2のOSへSSHで接続するときに使う、公開鍵と秘密鍵の組です。AWSのAPIへの認証に使うアクセスキーとは別のものです。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2", "t": "ユーザーデータ", "d": "起動時に自動実行するスクリプト", "k": "「起動時に自動で設定」", "b": "AMI=あらかじめ焼き込んだイメージ", "st": 0, "q": "EC2の起動時に、自動で実行されるスクリプトです。初期設定の自動化に使います。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2", "t": "Elastic IP (Internet Protocol)", "d": "固定のパブリックIPv4アドレス", "k": "「固定IP」", "b": "パブリックIPv4は使用中でも課金", "st": 0, "q": "EC2に割り当てられる、固定のパブリックIPv4アドレスです。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2", "t": "EC2 Image Builder", "d": "AMIの作成・テスト・配布を自動化するパイプライン", "k": "「ゴールデンイメージ」「イメージ作成の自動化」", "b": "AMI=成果物そのもの", "st": 0, "q": "AMIの作成、テスト、配布の流れを、自動化するサービスです。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2", "t": "料金オプション", "d": "オンデマンド / リザーブド / Savings Plans / スポット等", "k": "D4_購入オプションで整理", "b": "—", "st": 0, "q": ""}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon EC2 Auto Scaling", "d": "需要に応じてEC2の台数を自動で増減し、異常なインスタンスを置き換える", "k": "「台数を自動で増減」「需要に応じて」", "b": "ELB=負荷の分散。CloudWatch=検知", "st": 1, "q": "負荷に応じて、EC2の台数を自動で増減させるサービスです。異常なインスタンスの置き換えもできます。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2 Auto Scaling", "t": "スケールアウト / イン", "d": "台数の増減(水平)", "k": "「水平スケール」", "b": "スケールアップ=性能の増減", "st": 0, "q": "Auto Scalingで、サーバーの台数を増やす、または減らす動作です。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2 Auto Scaling", "t": "起動テンプレート", "d": "起動するEC2のAMI・タイプ・設定をまとめたもの", "k": "「起動設定のテンプレート」", "b": "AMI=OSイメージ", "st": 0, "q": "Auto Scalingが起動するEC2について、AMIやタイプなどの設定をまとめたものです。"}, {"s": "D3_コンピューティング", "l": 3, "p": "Amazon EC2 Auto Scaling", "t": "スケーリングポリシー", "d": "増減の条件(CPU使用率の目標値、スケジュール等)", "k": "「スケジュールで増減」「目標値」", "b": "—", "st": 0, "q": "Auto Scalingが台数を増減させる条件です。CPU使用率の目標値や、スケジュールなどを指定します。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "ELB (Elastic Load Balancing)", "d": "受信トラフィックを複数のターゲットへ分散し、正常なものにだけ送る", "k": "「負荷分散」「ヘルスチェック」", "b": "Auto Scaling=台数の調整。Route 53=DNSでの振り分け", "st": 1, "q": "受け取った通信を、複数のサーバーへ振り分けるサービスの総称です。正常なサーバーにだけ送ります。"}, {"s": "D3_コンピューティング", "l": 3, "p": "ELB", "t": "ALB (Application Load Balancer)", "d": "L7(HTTP (HyperText Transfer Protocol)/HTTPS)。パスやホスト名で振り分ける", "k": "「HTTP」「パス」「ホスト名」「レイヤー7」", "b": "NLB=L4", "st": 1, "q": "HTTPとHTTPSの通信を扱う、レイヤー7のロードバランサーです。パスやホスト名に応じて、振り分け先を変えられます。"}, {"s": "D3_コンピューティング", "l": 3, "p": "ELB", "t": "NLB (Network Load Balancer)", "d": "L4(TCP (Transmission Control Protocol)/UDP (User Datagram Protocol))。超高性能・低遅延、固定IPも可", "k": "「TCP/UDP」「超低遅延」「固定IP」", "b": "ALB=L7", "st": 1, "q": "TCPやUDPの通信を扱う、レイヤー4のロードバランサーです。非常に高い性能と低遅延を持ち、固定IPも使えます。"}, {"s": "D3_コンピューティング", "l": 3, "p": "ELB", "t": "GWLB (Gateway Load Balancer)", "d": "ファイアウォール等の仮想アプライアンスへ通信を流す", "k": "「仮想アプライアンス」", "b": "—", "st": 0, "q": "ファイアウォールなどの仮想アプライアンスへ、通信を流すためのロードバランサーです。"}, {"s": "D3_コンピューティング", "l": 3, "p": "ELB", "t": "CLB (Classic Load Balancer)", "d": "旧世代のロードバランサー。新規では使わない", "k": "「旧世代」", "b": "—", "st": 1, "q": "旧世代のロードバランサーです。新しく使うことは推奨されません。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "AWS Lambda", "d": "イベントをきっかけにコード(関数)を実行する。サーバー管理不要、実行時間分の課金", "k": "「サーバーレス」「関数」「イベント駆動」「S3にアップロードされたら」", "b": "Fargate=コンテナをサーバーレスで実行", "st": 1, "q": "イベントをきっかけにコード(関数)を実行するサービスです。サーバーの管理が要らず、実行した時間の分だけ課金されます。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon ECS (Elastic Container Service)", "d": "Dockerコンテナを管理・実行するオーケストレーション(AWS独自)", "k": "「コンテナのオーケストレーション」「Docker」", "b": "EKS=Kubernetes。Fargate=実行基盤", "st": 1, "q": "Dockerコンテナを、管理して実行するための、AWS独自のオーケストレーションサービスです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon EKS (Elastic Kubernetes Service)", "d": "Kubernetesのマネージド版", "k": "「Kubernetes」", "b": "ECS=AWS独自方式", "st": 0, "q": "Kubernetesを、AWSが管理する形で提供するサービスです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon ECR (Elastic Container Registry)", "d": "コンテナイメージの保管庫(レジストリ)", "k": "「イメージの保存・配布」", "b": "ECS=実行・管理", "st": 0, "q": "Dockerのコンテナイメージを、保管して配布するための保管庫(レジストリ)です。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "AWS Fargate", "d": "ECS・EKSのコンテナを、サーバー(EC2)を管理せずに実行する基盤", "k": "「コンテナをサーバーレスで」「サーバー管理不要」、「マネージドなコンテナ基盤」", "b": "ECS=管理役。Lambda=関数", "st": 1, "q": "ECSやEKSのコンテナを、EC2のサーバーを管理せずに実行できる基盤です。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon Lightsail", "d": "月額固定の簡易な仮想サーバー(VPS: Virtual Private Server)", "k": "「簡単」「月額固定」「小規模」", "b": "EC2=細かく設定できる", "st": 0, "q": "月額固定の料金で使える、簡単な仮想サーバーです。小規模な用途に向いています。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "AWS Elastic Beanstalk", "d": "コードを上げるだけで、デプロイ・容量・負荷分散・Auto Scaling・監視を自動で用意する(PaaS)", "k": "「Webアプリのデプロイを自動化」「PaaS」", "b": "CloudFormation=インフラをテンプレートで定義", "st": 0, "q": "アプリのコードをアップロードするだけで、デプロイ、負荷分散、Auto Scaling、監視を、自動で用意してくれるPaaSです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "AWS Batch", "d": "大量のバッチジョブの投入・スケジューリング・計算資源を管理する", "k": "「バッチジョブ」", "b": "Step Functions=処理の流れ", "st": 0, "q": "大量のバッチ処理のジョブを、投入、スケジューリングして、必要な計算資源も管理するサービスです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon SQS (Simple Queue Service)", "d": "メッセージを溜めるキュー。受信側が取りに行く(プル型)。障害時もメッセージを保持", "k": "「キュー」「疎結合」「メッセージを保持」", "b": "SNS=プッシュ型で配る", "st": 0, "q": "メッセージをためておくキューのサービスです。受信側が取りに行く方式で、システム同士の結合を弱くできます。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon SNS (Simple Notification Service)", "d": "1つのメッセージを複数の宛先へプッシュ配信する(パブリッシュ / サブスクライブ)", "k": "「通知」「プッシュ」「複数宛先」「アラーム通知」", "b": "SQS=溜める。SES=メール送信", "st": 0, "q": "1つのメッセージを、複数の宛先へ一斉にプッシュで配信する通知サービスです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "AWS Step Functions", "d": "複数の処理(Lambda等)の流れを、ワークフローとして組み立てる", "k": "「ワークフロー」「処理の順序」", "b": "EventBridge=イベントの振り分け", "st": 0, "q": "複数の処理(Lambdaなど)の流れを、ワークフローとして組み立てて実行するサービスです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon EventBridge", "d": "イベントを受け、ルールに従ってLambda等のターゲットへ振り分ける", "k": "「イベントバス」「スケジュール実行」", "b": "SNS=通知の配信", "st": 0, "q": "イベントを受け取り、ルールに従って、Lambdaなどの宛先へ振り分けるサービスです。"}, {"s": "D3_コンピューティング", "l": 2, "p": "", "t": "Amazon API Gateway", "d": "APIの公開窓口を作る(認証・流量制御)", "k": "「APIの公開」", "b": "Lambda=処理の本体", "st": 0, "q": "アプリのAPIを公開するための窓口を作るサービスです。認証や流量制御もできます。"}, {"s": "D3_EC2・EBS・DB補足", "l": 3, "p": "Amazon EC2", "t": "インスタンスファミリー: 汎用", "d": "CPU・メモリのバランス型", "k": "「一般的なWebサーバー」", "b": "—", "st": 0, "q": "EC2のインスタンスファミリーで、CPUとメモリのバランスがよい、一般的な用途向けの種類です。"}, {"s": "D3_EC2・EBS・DB補足", "l": 3, "p": "Amazon EC2", "t": "インスタンスファミリー: コンピューティング最適化", "d": "CPU性能を重視", "k": "「CPU集約型」「HPC (High Performance Computing)」、「CPU性能を重視」", "b": "メモリ最適化=大量のメモリ", "st": 0, "q": "EC2のインスタンスファミリーで、CPUの性能を重視した種類です。高性能な計算処理などに向きます。"}, {"s": "D3_EC2・EBS・DB補足", "l": 3, "p": "Amazon EC2", "t": "インスタンスファミリー: メモリ最適化", "d": "大容量のメモリを重視", "k": "「インメモリ処理」「大規模DB」", "b": "—", "st": 0, "q": "EC2のインスタンスファミリーで、大容量のメモリを重視した種類です。インメモリ処理や大規模なDBに向きます。"}, {"s": "D3_EC2・EBS・DB補足", "l": 3, "p": "Amazon EC2", "t": "インスタンスファミリー: ストレージ最適化", "d": "ローカルストレージの高いI/O性能", "k": "「高いI/O」「大量の読み書き」", "b": "—", "st": 0, "q": "EC2のインスタンスファミリーで、ローカルストレージの高いI/O性能を重視した種類です。"}, {"s": "D3_EC2・EBS・DB補足", "l": 3, "p": "Amazon EC2", "t": "インスタンスファミリー: 高速コンピューティング", "d": "GPU等のアクセラレーターを使う", "k": "「GPU」「機械学習」", "b": "—", "st": 0, "q": "EC2のインスタンスファミリーで、GPUなどのアクセラレーターを使う種類です。機械学習などに向きます。"}, {"s": " "", "t": "AWS Global Accelerator", "d": "固定のエニーキャストIPで利用者を最寄りのエッジに収容し、AWS網経由で最適なリージョンへ届ける", "k": "「固定IP」「TCP/UDP」「リージョン間のフェイルオーバー」、「グローバルな経路最適化」「ヘルスチェック」「Anycast IP」", "b": "CloudFront=キャッシュ配信", "st": 1, "q": "固定のエニーキャストIPで、利用者を近くのエッジへ受け入れ、AWSの回線網を通して最適なリージョンへ届けるサービスです。キャッシュはしません。"}, {"s": "D3_ネットワーク", "l": 2, "p": "", "t": "AWS PrivateLink", "d": "VPCから他のサービス(AWS・SaaS・他のVPC)へ、インターネットを経由せず非公開で接続する", "k": "「プライベート接続」「公開インターネットを使わない」", "b": "VPCピアリング=VPC全体をつなぐ", "st": 0, "q": "VPCから、他のサービス(AWSやSaaS、別のVPC)へ、インターネットを経由せずに、非公開で接続する仕組みです。"}, {"s": "D3_ストレージ", "l": 2, "p": "", "t": "Amazon S3 (Simple Storage Service)", "d": "オブジェクトストレージ。容量無制限、高耐久(自動で複数AZに複製)、URLでアクセス", "k": "「画像・動画を保存」「容量の予測が不要」「URLでダウンロード」", "b": "EBS=ブロック(1台に接続)。EFS=ファイル共有", "st": 1, "q": "オブジェクトとして、画像や動画などのデータを保存するサービスです。容量に上限がなく、高い耐久性があり、URLでアクセスできます。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "ストレージクラス", "d": "アクセス頻度で選ぶ料金区分。Standard / Standard-IA (Infrequent Access)(低頻度・即時取得)/ One Zone-IA(単一AZ)/ Intelligent-Tiering(自動で移動)", "k": "「アクセスパターンが予測できない」→Intelligent-Tiering、「自動で階層化して節約」", "b": "Glacier=アーカイブ用", "st": 0, "q": "S3で、アクセスの頻度に応じて選ぶ料金の区分です。Standard、Standard-IA、One Zone-IA、Intelligent-Tieringなどがあります。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "S3 Glacier", "d": "長期アーカイブ。Instant Retrieval(ミリ秒)/ Flexible Retrieval(数分〜数時間)/ Deep Archive(最安、取り出しに12時間程度)", "k": "「ミリ秒で取り出す」→Instant、「年に数回・数時間」→Flexible、「7年以上・最安」→Deep Archive、「低頻度で、復元時間を許容」→Flexible", "b": "Standard-IA=アーカイブではない低頻度アクセス", "st": 1, "q": "S3の長期アーカイブ向けのストレージクラスです。取り出しの速さが3種類あり、遅いほど安くなります。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "ライフサイクルルール", "d": "一定期間の経過後に、別のクラスへ移行・削除する", "k": "「30日後にGlacierへ」", "b": "Intelligent-Tiering=アクセス状況で自動移動", "st": 0, "q": "S3で、決めた期間が過ぎたオブジェクトを、別のクラスへ移したり、削除したりする設定です。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "バージョニング", "d": "上書き・削除の前の版を保持する", "k": "「誤って削除したものを戻す」「以前の状態へ戻す」、「世代管理」「削除からの復旧」", "b": "Object Lock=そもそも削除させない", "st": 1, "q": "S3で、上書きや削除をされる前の版を、残しておく機能です。誤って消したデータを戻せます。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "MFA Delete (Multi-Factor Authentication)", "d": "版の削除やバージョニングの停止にMFAを要求する。前提はバージョニング", "k": "「削除時にMFA」", "b": "—", "st": 1, "q": "S3で、オブジェクトの版の削除などをするときに、MFAによる認証を求める機能です。バージョニングが前提です。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "Object Lock", "d": "一定期間、変更・削除を禁止する。WORM (Write Once Read Many)", "k": "「改ざん防止」「規制で保持」", "b": "バージョニング=戻せるが、削除自体は可能", "st": 1, "q": "S3で、決めた期間は、オブジェクトを変更も削除もできなくする機能です。WORMとも呼ばれます。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "レプリケーション", "d": "別バケット・別リージョンへ自動で複製する。CRR (Cross-Region Replication) / SRR (Same-Region Replication)", "k": "「別リージョンへ自動コピー」", "b": "バージョニング=同じバケット内の版", "st": 1, "q": "S3で、オブジェクトを別のバケットや別のリージョンへ、自動でコピーする機能です。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "Transfer Acceleration", "d": "エッジロケーション経由で、遠隔地からS3へのアップロードを高速化する", "k": "「遠隔地から」「長距離の転送」", "b": "マルチパート=分割して並列", "st": 1, "q": "S3で、エッジロケーションを経由して、遠く離れた場所からのアップロードを速くする機能です。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "マルチパートアップロード", "d": "大きなファイルを分割し、並列でアップロードする", "k": "「大きなファイル」「分割」", "b": "Transfer Acceleration=距離の問題を解決", "st": 1, "q": "S3で、大きなファイルを分割して、並列にアップロードする方法です。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "Block Public Access", "d": "バケットの意図しない公開を防ぐ一括設定", "k": "「公開を防ぐ」", "b": "バケットポリシー=個別の許可設定", "st": 1, "q": "S3のバケットが、意図せず公開されてしまうことを、一括で防ぐ設定です。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "静的ウェブサイトホスティング", "d": "S3だけでHTML等の静的サイトを公開する", "k": "「最小の運用で静的サイト」、「静的コンテンツ」「サーバー管理不要」", "b": "EC2は不要", "st": 0, "q": "S3だけで、HTMLなどの静的なWebサイトを公開できる機能です。サーバーの管理は要りません。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "暗号化", "d": "保存時の暗号化。SSE (Server-Side Encryption)。選択・設定はお客様", "k": "「保存データの暗号化」", "b": "鍵の管理はKMS", "st": 0, "q": "S3で、保存するデータを暗号化する機能です。設定はお客様が行い、鍵の管理にはKMSなどを使います。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "バケットポリシー", "d": "バケット(リソース)側に付けるアクセス許可", "k": "「リソースベースのポリシー」「特定のバケットへ許可」", "b": "IAMポリシー=ID(ユーザー・ロール)側", "st": 0, "q": "S3のバケットに対して付ける、アクセス権限のルールです。IAMポリシーとは異なり、リソース側に付けます。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon S3", "t": "S3 イベント通知 (Event Notifications)", "d": "オブジェクトの作成等をきっかけに、Lambda・SNS・SQSを起動する", "k": "「アップロードされたら処理」", "b": "—", "st": 0, "q": "S3で、オブジェクトの作成などをきっかけに、Lambda、SNS、SQSを起動する機能です。"}, {"s": "D3_ストレージ", "l": 2, "p": "", "t": "Amazon EBS (Elastic Block Store)", "d": "EC2にネットワーク経由で接続する、永続的なブロックストレージ(同一AZ内)", "k": "「EC2のディスク」「ルートボリューム」「永続」「継続的に更新するデータ」", "b": "インスタンスストア=一時。EFS=共有", "st": 1, "q": "EC2にネットワーク経由でつなぐ、永続的なブロックストレージです。同じAZの中で使います。"}, {"s": "D3_ストレージ", "l": 3, "p": "Amazon EBS", "t": "スナップショット", "d": "EBSの特定時点のバックアップ(S3に保存)", "k": "「ポイントインタイム」「EBSのバックアップ」、「保存量に応じて課金」", "b": "AMI=起動用のイメージ", "st": 1, "q": "EBSの、ある時点のバックアップです。S3に保存されます。"}, {"s": "D3_ストレージ", "l": 2, "p": "", "t": "インスタンスストア (Instance Store)", "d": "EC2のホストに物理接続された一時ストレージ。停止・終了で消える", "k": "「一時データ」「物理的に接続」「消えてもよい」", "b": "EBS=永続", "st": 1, "q": "EC2のホストに物理的につながっている、一時的なストレージです。停止や終了で、データが消えます。"}, {"s": "D3_ストレージ", "l": 2, "p": "", "t": "Amazon EFS (Elastic File System)", "d": "複数のEC2(複数AZ)から同時にマウントできる共有ファイルストレージ。NFS (Network File System)、Linux向け", "k": "「複数インスタンスで共有」「NFS」「マウント」", "b": "FSx for Windows=SMB(Windows向け)", "st": 1, "q": "複数のEC2から、複数のAZをまたいで同時にマウントして使える、共有のファイルストレージです。Linux向けでNFSを使います。"}, {"s": "D3_ストレージ", "l": 2, "p": "", "t": "Amazon FSx", "d": "特定用途向けのファイルシステム。Windows File Server(SMB (Server Message Block))、Lustre(HPC向け)等", "k": "「SMB」「Windows互換」", "b": "EFS=Linux向け", "st": 0, "q": "Windows File ServerやLustreなど、特定の用途に合わせた、マネージドなファイルシステムです。"}, {"s": "D3_ストレージ", "l": 2, "p": "", "t": "AWS Storage Gateway", "d": "オンプレミスから、クラウドのストレージを使うハイブリッド型サービス", "k": "「オンプレミスの容量をAWSへ拡張」", "b": "DataSync=データの移行・転送", "st": 0, "q": "オンプレミスから、クラウドのストレージを使えるようにする、ハイブリッド向けのサービスです。"}, {"s": "D3_ストレージ", "l": 3, "p": "AWS Storage Gateway", "t": "Tape Gateway", "d": "仮想テープライブラリとして、テープバックアップをAWSへ移す", "k": "「仮想テープライブラリ」", "b": "—", "st": 0, "q": "Storage Gatewayの1つで、仮想のテープライブラリとして、テープバックアップをAWSへ移す機能です。"}, {"s": "D3_ストレージ", "l": 2, "p": "  "コンソール=GUI", "st": 1, "q": "ブラウザの中で使える、CLIの環境です。インストールは要りません。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS CloudFormation", "d": "テンプレート(JSON / YAML)でインフラをコード化し、再現・自動構築する。IaC (Infrastructure as Code)", "k": "「Infrastructure as Code」「テンプレート」「再現可能」「復旧の自動化」、「宣言的な構成」「再現可能な復旧」", "b": "Elastic Beanstalk=アプリ環境の自動化", "st": 0, "q": "インフラの構成をテンプレート(JSONまたはYAML)に書いて、自動で構築できるサービスです。コードでインフラを管理します。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS CDK (Cloud Development Kit)", "d": "プログラミング言語でインフラを定義する(CloudFormationを生成)", "k": "「言語でIaC」", "b": "CloudFormation=JSON・YAMLで定義", "st": 0, "q": "プログラミング言語を使って、インフラの構成を定義できるツールです。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS Systems Manager", "d": "運用管理をまとめて行う(D2_監視・監査・診断を参照)", "k": "「運用作業の一元管理」", "b": "—", "st": 1, "q": ""}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS Health Dashboard", "d": "AWS側の障害やメンテナンスと、自分の環境への影響を通知する(旧名: Personal Health Dashboard)", "k": "「AWSサービスの稼働状況」「RSS」「AWS側のイベント」", "b": "CloudWatch=自分のワークロードの監視", "st": 0, "q": "AWS側の障害やメンテナンスと、それが自分の環境へ与える影響を、知らせてくれるサービスです。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS CodeBuild / CodeDeploy / CodePipeline", "d": "ビルドとテスト / デプロイ / CI/CD (Continuous Integration / Continuous Delivery) の工程全体の連携", "k": "「コンパイル・テスト」→CodeBuild、「工程の連携」→CodePipeline、「パイプライン」「継続的デリバリー」", "b": "—", "st": 0, "q": "ソースコードのビルドとテスト、デプロイ、そして一連の流れの連携(CI/CD)を担う、開発者向けのサービス群です。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS X-Ray", "d": "分散アプリのリクエストを追跡し、遅延箇所を特定する", "k": "「分散トレース」「遅延箇所の特定」", "b": "CloudWatch=メトリクス", "st": 0, "q": "分散したアプリの処理を追跡して、遅い箇所を見つけるためのサービスです。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS Resource Groups / Tag Editor", "d": "タグでリソースを論理グループ化して表示 / 複数リソースのタグを横断検索・一括編集", "k": "「グループ化して表示」→Resource Groups、「タグを一括編集」→Tag Editor、「タグベースの集合」「カスタム表示」「横断検索」", "b": "タグポリシー=命名規則の統制", "st": 0, "q": "タグでリソースをグループにして表示する機能と、複数のリソースのタグを、まとめて検索・編集する機能です。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "AWS CodeCommit", "d": "Gitリポジトリ(ソースコードの保管)。提供状況はXxx: 公式で要確認", "k": "「ソースコードの保管」", "b": "CodeBuild=ビルド", "st": 0, "q": "ソースコードをGitで保管する、リポジトリのサービスです。"}, {"s": "D3_操作・開発・運用", "l": 2, "p": "", "t": "タグ (Tags)", "d": "キーと値の組のメタデータ。リソースの分類・検索・フィルタ・コスト集計に使う", "k": "「キー値形式のメタデータ」「分類・検索・フィルタ」", "b": "Resource Groups=タグでまとめて表示。タグポリシー=命名の統制", "st": 0, "q": "リソースに付ける、キーと値の組のメタデータです。分類、検索、コストの集計に使います。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "AWS Application Discovery Service", "d": "移行前に、サーバーの利用状況と依存関係を収集する", "k": "「依存関係」「既存環境の調査」", "b": "Migration Evaluator=事業性の評価", "st": 1, "q": "移行の前に、既存のサーバーの利用状況や依存関係を、収集するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "AWS Migration Hub", "d": "複数の移行ツールの進捗を一元管理する", "k": "「進捗の追跡」「ダッシュボード」", "b": "—", "st": 1, "q": "複数の移行ツールでの作業の進捗を、1か所で確認できるサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "AWS Application Migration Service (MGN)", "d": "サーバーを継続的に複製し、そのままAWSへ移行する(リホスト)", "k": "「リフト&シフト」「サーバーの複製」", "b": "DMS=データベースの移行", "st": 1, "q": "サーバーを継続的に複製して、そのままAWSへ移行する(リホスト)サービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon SES (Simple Email Service)", "d": "メールの送信", "k": "「メール」", "b": "SNS=通知", "st": 1, "q": "メールを送信するためのサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Connect", "d": "クラウド型のコンタクトセンター", "k": "「コールセンター」", "b": "—", "st": 0, "q": "クラウド上で使える、コンタクトセンター(コールセンター)のサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon WorkSpaces", "d": "永続的な仮想デスクトップ(DaaS)", "k": "「仮想デスクトップ」「VDI」", "b": "AppStream=アプリだけを配信", "st": 0, "q": "クラウド上に、永続的な仮想デスクトップを用意するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon AppStream 2.0", "d": "アプリだけをブラウザへストリーミング配信する", "k": "「アプリのストリーミング」", "b": "WorkSpaces=デスクトップ全体", "st": 0, "q": "アプリケーションだけを、ブラウザへストリーミングして配信するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon SageMaker", "d": "機械学習 (ML: Machine Learning) モデルの構築・学習・デプロイ", "k": "「独自のモデルを作る」", "b": "Rekognition等=学習済みのサービス", "st": 0, "q": "機械学習のモデルを、構築、学習、デプロイするための基盤です。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Rekognition", "d": "画像・動画の分析(顔・物体)", "k": "「顔認証」「画像認識」", "b": "—", "st": 0, "q": "画像や動画の中から、顔や物体を分析するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Comprehend", "d": "文章の分析(感情・分類・キーフレーズ)", "k": "「テキストの分類」「感情分析」", "b": "Kendra=検索", "st": 0, "q": "文章を分析して、感情の判定や分類などを行うサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Polly", "d": "テキストを音声で読み上げる", "k": "「読み上げ」", "b": "Transcribe=逆(音声→文字)", "st": 0, "q": "文字のテキストを、音声で読み上げるサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Transcribe", "d": "音声を文字に変換する", "k": "「文字起こし」「コールセンターの音声」", "b": "Polly=逆(文字→音声)", "st": 0, "q": "音声を、文字のテキストに変換するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Translate", "d": "翻訳", "k": "「翻訳」", "b": "—", "st": 0, "q": "テキストを、別の言語へ翻訳するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Lex", "d": "音声・テキストの会話型チャットボット", "k": "「会話ボット」", "b": "Polly=読み上げのみ", "st": 0, "q": "音声やテキストで会話する、チャットボットを作るサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Kendra", "d": "自然言語の質問で、企業内の文書を検索する", "k": "「企業内検索」「自然言語の質問」", "b": "OpenSearch=全文検索エンジン", "st": 0, "q": "自然な言葉での質問を使って、企業内の文書を検索するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Bedrock", "d": "生成AI (AI: Artificial Intelligence) の基盤モデルを、APIで利用する", "k": "「生成AI」「基盤モデル」", "b": "SageMaker=自分で学習", "st": 0, "q": "生成AIの基盤モデルを、APIから利用できるサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "AWS IoT Core", "d": "IoT (Internet of Things) 機器を安全に接続し、メッセージを収集する", "k": "「IoT機器の接続」", "b": "Timestream=データの保存", "st": 0, "q": "IoT機器を、安全にAWSへ接続して、メッセージを収集するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "AWS Migration Evaluator", "d": "オンプレミスの利用状況から、移行のビジネスケースやTCO (Total Cost of Ownership) を作る", "k": "「TCO」「移行の事業性」", "b": "Pricing Calculator=構成の見積もり", "st": 0, "q": "オンプレミスの利用状況から、移行のビジネスケースやTCOを作成するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "AWS Launch Wizard", "d": "SQL Server・SAP等の導入と構成を自動化する", "k": "「SAPやSQL Serverの導入」", "b": "—", "st": 0, "q": "SQL ServerやSAPなどの導入と構成を、自動化するサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "AWS Data Exchange", "d": "第三者のデータを購読・利用する", "k": "「外部データの購入」", "b": "Marketplace=ソフトウェア", "st": 0, "q": "第三者が提供するデータを、購読して利用できるサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon Textract", "d": "文書から文字や表を抽出する。OCR (Optical Character Recognition)", "k": "「OCR」「帳票の読み取り」", "b": "Comprehend=文章の意味を分析", "st": 0, "q": "文書の画像から、文字や表を抽出するOCRのサービスです。"}, {"s": "D3_移行・その他", "l": 2, "p": "", "t": "Amazon MQ (Message Queue)", "d": "マネージドなメッセージブローカー(ActiveMQ / RabbitMQ)。既存アプリの移行向け", "k": "「既存のメッセージブローカーを移行」", "b": "SQS・SNS=AWSネイティブ", "st": 0, "q": "ActiveMQやRabbitMQを、AWSが管理する形で提供する、メッセージブローカーのサービスです。既存のアプリの移行に向きます。"}, {"s": "D4_購入オプション", "l": 3, "p": "Amazon EC2", "t": "オンデマンド (On-Demand)", "d": "契約なし。使った分だけ支払う", "k": "「短期」「中断できない」「1日だけ」「予測できない」、「中断不可」「事前契約不要」「月末に約20時間など短時間」", "b": "スポット=中断あり", "st": 1, "q": "契約なしで、使った分だけ支払う、EC2の購入オプションです。"}, {"s": "D4_購入オプション", "l": 3, "p": "Amazon EC2", "t": "リザーブドインスタンス (RI: Reserved Instances)", "d": "1年 / 3年の契約で大幅に割り引く", "k": "「1年以上の安定利用」「同じタイプを常時使う」", "b": "Savings Plans=金額でコミット", "st": 1, "q": "1年または3年の契約と引き換えに、大幅な割引を受けられる、EC2の購入オプションです。"}, {"s": "D4_購入オプション", "l": 3, "p": "Amazon EC2", "t": "Savings Plans", "d": "1時間あたりの利用額を1年 / 3年コミットして割り引く", "k": "「利用額をコミット」「複数サービスに適用」", "b": "RI=インスタンスの属性で予約", "st": 1, "q": "1時間あたりの利用額を、1年または3年間コミットすることで、割引を受けられる購入オプションです。"}, {"s": "D4_購入オプション", "l": 3, "p": "Amazon EC2", "t": "スポットインスタンス (Spot Instances)", "d": "余剰容量を最大90%割引で使う。中断される可能性がある", "k": "「中断してもよい」「バッチ処理」「最小コスト」", "b": "オンデマンド=中断なし", "st": 1, "q": "AWSの余った容量を、最大90%の割引で使える購入オプションです。中断される可能性があります。"}, {"s": "D4_購入オプション", "l": 3, "p": "Amazon EC2", "t": "Dedicated Hosts", "d": "物理サーバーを専有する。ソケット・コアが見え、ライセンスを持ち込める(BYOL)", "k": "「BYOL」「物理ホストの可視性」", "b": "Dedicated Instances=専有だがホストは選べない", "st": 1, "q": "物理サーバーを専有でき、ソケットやコアの数が見えるので、ソフトウェアのライセンスを持ち込めるEC2の購入オプションです。"}, {"s": "D4_購入オプション", "l": 3, "p": "Amazon EC2", "t": "Dedicated Instances", "d": "他のアカウントとハードウェアを共有しない", "k": "「シングルテナント」", "b": "Dedicated Hosts=ホスト単位で管理", "st": 0, "q": "他のアカウントとハードウェアを共有しない、EC2の購入オプションです。ホストの指定はできません。"}, {"s": "D4_購入オプション", "l": 3, "p": "Amazon EC2", "t": "On-Demand Capacity Reservations", "d": "特定のAZで容量を確保する(割引はない)", "k": "「容量を確実に確保」「特定期間」、「容量保証」「期間指定」", "b": "RI=割引が主目的", "st": 1, "q": "特定のAZで、EC2の容量を確保しておく購入オプションです。割引はありません。"}, {"s": "D4_購入オプション", "l": 3, "p": "リザーブドインスタンス", "t": "Standard RI", "d": "割引率が最も高い。属性の変更に制限がある", "k": "「同じタイプを長期で使う」、「構成を固定して長期利用」", "b": "Convertible RI=変更可", "st": 0, "q": "リザーブドインスタンスの種類で、割引率が高い代わりに、属性の変更には制限があります。"}, {"s": "D4_購入オプション", "l": 3, "p": "リザーブドインスタンス", "t": "Convertible RI", "d": "インスタンスの属性を変更できる。割引は小さめ", "k": "「将来タイプを変える可能性」", "b": "Standard RI=割引が大きい", "st": 0, "q": "リザーブドインスタンスの種類で、インスタンスの属性を変更できますが、割引は小さめです。"}, {"s": "D4_購入オプション", "l": 3, "p": "Savings Plans", "t": "Compute Savings Plans", "d": "最も柔軟。EC2・Fargate・Lambdaに適用され、リージョンやファミリーを問わない", "k": "「Lambdaの割引」「最も柔軟」", "b": "EC2 Instance SP=ファミリー固定", "st": 0, "q": "Savings Plansの種類で、最も柔軟です。EC2、Fargate、Lambdaに適用され、リージョンやファミリーを問いません。"}, {"s": "D4_購入オプション", "l": 3, "p": "Savings Plans", "t": "EC2 Instance Savings Plans", "d": "特定のリージョン・インスタンスファミリーに固定。割引率は高め", "k": "「ファミリーとリージョンを前提に」、「構成を固定して長期利用」", "b": "Compute SP=柔軟だが割引は低め", "st": 1, "q": "Savings Plansの種類で、特定のリージョンとインスタンスファミリーに固定する代わりに、割引率が高めです。"}, {"s": "D4_購入オプション", "l": 0, "p": "支払オプション", "t": "全額前払い / 一部前払い / 前払いなし", "d": "全額前払いが最も割引が大きい(RI・Savings Plans)", "k": "「最大の割引」→3年・全額前払い", "b": "—", "st": 0, "q": "RIやSavings Plansの支払い方法の3種類です。全額前払いが、最も割引が大きくなります。"}, {"s": "D4_料金・コスト管理", "l": 0, "p": "料金の考え方", "t": "従量課金", "d": "使った分だけ支払う", "k": "「先行投資なし」、「使用したリソース量に応じて支払う」", "b": "—", "st": 0, "q": "使った分だけ、料金を支払う仕組みです。"}, {"s": "D4_料金・コスト管理", "l": 0, "p": "料金の考え方", "t": "割引の仕組み", "d": "使うほど単価が下がる段階料金(S3等)と、予約・コミットによる割引", "k": "「ボリュームディスカウント」", "b": "—", "st": 0, "q": "使うほど単価が下がる段階料金と、予約やコミットによる割引の、2種類があります。"}, {"s": "D4_料金・コスト管理", "l": 0, "p": "料金の考え方", "t": "データ転送料", "d": "AWSへの受信(IN)は原則無料。送信(OUT)、リージョン間、AZ間は有料", "k": "「インバウンドは無料」、「通常の送信データ転送は課金対象」", "b": "—", "st": 0, "q": "AWSへの受信は原則として無料で、AWSからの送信や、リージョン間、AZ間の通信は   return DATA.filter(r => c.sheets.includes(r.s) && modes.some(m => ELIG[m](r)));
}
function reviewList(c){
  const modes = c.mode === "mix" ? ["d","t"] : [c.mode];
  return Object.entries(store.wrong).map(([k,w]) => ({r:byKey.get(k), w}))
    .filter(x => x.r && c.sheets.includes(x.r.s) && modes.some(m => ELIG[m](x.r)))
    .sort((a,b) => (a.w.a||0) - (b.w.a||0)).map(x => x.r);
}
const sig = c => c.sheets.slice().sort().join(",") + "|" + c.mode;
function distractors(row, mode, disp){
  const cands = DATA.filter(r => rkey(r) !== rkey(row) && ELIG[mode](r));
  const seen = new Set([disp(row).toLowerCase()]);
  const scored = cands.map(r => ({r, sc: (r.l === row.l ? 4 : 0) + (row.p && r.p === row.p ? 3 : 0) + (r.s === row.s ? 2 : 0) + Math.random()*0.9}))
    .sort((a,b) => b.sc - a.sc);
  const out = [];
  for (const {r} of scored){
    const d = disp(r).toLowerCase();
    if (seen.has(d)) continue;
    if (mode === "d" && (names(row.t).some(n => r.t.includes(n)) || names(r.t).some(n => row.t.includes(n)))) continue;
    seen.add(d); out.push(r);
    if (out.length === 3) break;
  }
  return out;
}
function makeQ(row, mode){
  const disp = mode === "t" ? (r => r.q) : (r => r.t);
  const opts = shuffle([row, ...distractors(row, mode, disp)]).map(r => ({row: r, text: disp(r)}));
  return {row, mode, opts, correct: opts.findIndex(o => o.row === row)};
}
function buildRound(c, only){
  const modes = c.mode === "mix" ? ["d","t"] : [c.mode];
  let list;
  const lim = c.n > 0 ? c.n : Infinity;
  const review = c.course === "review";
  if (only) list = shuffle(only.map(k => byKey.get(k)).filter(Boolean));
  else if (review) list = c.order === "random" ? shuffle(reviewList(c)) : reviewList(c);
  else if (c.order === "random") list = shuffle(orderedList(c));
  else {
    const all = orderedList(c);
    const p = all.length ? (store.pos[sig(c)] || 0) % all.length : 0;
    list = all.slice(p).concat(all.slice(0, p));
  }
  const qs = [];
  let used = 0;
  for (const r of list){
    if (qs.length >= lim) break;
    used++;
    const avail = modes.filter(m => ELIG[m](r));
    if (!avail.length) continue;
    const q = makeQ(r, avail[Math.floor(Math.random()*avail.length)]);
    if (q.opts.length < 3) continue;
    qs.push(q);
  }
  if (!only && !review && c.order === "order" && qs.length){
    const all = orderedList(c);
    store.pos[sig(c)] = ((store.pos[sig(c)] || 0) + used) % Math.max(1, all.length);
    save();
  }
  return qs;
}

// 画面
const app = $("#app");
let cfg = {course:"normal", mode:"d", sheets:ALL_SHEETS.slice(), order:"random", n:10};
if (store.cfg){
  const c = store.cfg;
  if (["d","t","mix"].includes(c.mode)) cfg.mode = c.mode;
  if (Array.isArray(c.sheets)){ const s = c.sheets.filter(x => ALL_SHEETS.includes(x)); if (s.length) cfg.sheets = s; }
  if (["random","order"].includes(c.order)) cfg.order = c.order;
  if ([10,30,0].includes(c.n)) cfg.n = c.n;
  if (["normal","review"].includes(c.course)) cfg.course = c.course;
}
let round = null;

const MODES = [
 ["d","説明 → 用語","サービス・機能・仕組みの説明を読んで、どの用語かを選びます。"],
 ["t","用語 → 説明","用語を見て、その用語の正しい説明を選びます。"],
 ["mix","ミックス","上の2つの問い方を混ぜて出します。"]
];
const COURSES = [
 ["normal","通常コース","選んだ範囲の用語を出題します。"],
 ["review","復習コース(間違えた用語だけ)","これまでに間違えた用語だけを出題します。連続"+CLEAR+"回正解すると、リストから外れます。"]
];
function courseHtml(){
  return `<div class="modes">` + COURSES.map(([v,t,d]) => `<div><input type="radio" name="course" id="course-${v}" value="${v}" ${cfg.course===v?"checked":""}><label for="course-${v}"><b>${t}</b><span>${d}</span></label></div>`).join("") + `</div>`;
}
function modeHtml(){
  return `<div class="modes">` + MODES.map(([v,t,d]) => `<div><input type="radio" name="mode" id="mode-${v}" value="${v}" ${cfg.mode===v?"checked":""}><label for="mode-${v}"><b>${t}</b><span>${d}</span></label></div>`).join("") + `</div>`;
}
function rangeHtml(){
  return GROUPS.map((g,gi) => {
    const n = g.items.reduce((x,i) => x + countOf(i[0]), 0);
    return `<div class="grp"><label class="gh"><input type="checkbox" data-g="${gi}"><b>${esc(g.g)}</b><span class="cnt">${n}語</span></label>` +
      g.items.map(([s,l,h]) => `<label class="item"><input type="checkbox" name="sheet" value="${esc(s)}" ${cfg.sheets.includes(s)?"checked":""}><span>${esc(l)}<span class="cnt">${countOf(s)}語</span><small>${esc(h)}</small></span></label>`).join("") + `</div>`;
  }).join("");
}
function seg(name, items, cur){
  return `<div class="seg">` + items.map(([v,l]) => `<input type="radio" name="${name}" id="${name}-${v}" value="${v}" ${String(cur)===String(v)?"checked":""}><label for="${name}-${v}">${l}</label>`).join("") + `</div>`;
}
function statsView(){
  const ent = Object.entries(store.stats);
  const a = ent.reduce((x,[,s]) => x + s.a, 0), w = ent.reduce((x,[,s]) => x + s.w, 0);
  const acc = a ? Math.round((a-w)/a*100) + "%" : "—";
  const wl = Object.entries(store.wrong).map(([k,v]) => ({k, v, r:byKey.get(k)})).filter(x => x.r).sort((x,y) => (y.v.t||0) - (x.v.t||0));
  const li = x => `<li><span>${esc(x.r.t)}<br><small>${esc(SHEETLABEL[x.r.s]||x.r.s)}・誤答${x.v.m}回・連続正解 ${x.v.s||0}/${CLEAR}</small></span><button class="link" type="button" data-rm="${esc(x.k)}">外す</button></li>`;
  const head = wl.slice(0,8).map(li).join(""), rest = wl.slice(8).map(li).join("");
  const wrongPanel = `<div class="panel"><h2>間違えた用語(復習リスト)<span class="cnt">${wl.length}語</span></h2>` +
    (wl.length ? `<ul class="weak">${head}</ul>` + (rest ? `<details><summary class="note">残り${wl.length-8}語を見る</summary><ul class="weak">${rest}</ul></details>` : "") +
      `<div class="row" style="margin-top:6px"><button class="link" id="wclear" type="button">リストを空にする</button></div>`
      : `<p class="note">まだありません。通常コースで間違えた用語が、自動でここに溜まります。</p>`) + `</div>`;
  return wrongPanel + `<div class="panel"><h2>これまでの記録</h2>
   <div class="stats"><div class="stat"><b>${a}</b><span>解答数</span></div><div class="stat"><b>${acc}</b><span>正答率</span></div><div class="stat"><b>${ent.length}</b><span>出題した用語</span></div></div>
   <div class="row" style="margin-top:8px"><button class="link" id="exp" type="button">記録を書き出す</button><button class="link" id="imp" type="button">記録を読み込む</button><button class="link" id="rst" type="button">記録を消す</button></div></div>`;
}
function home(){
  round = null;
  app.innerHTML = `
   <h1>AWS CLF 用語トレーニング</h1>
   <p class="lead">サービス・機能・仕組みの説明と、用語を結び付けて覚える4択の練習です。全${DATA.length}語を収録しています。</p>
   <div class="panel"><h2>出題の設定</h2>
    <fieldset><legend>コース</legend>${courseHtml()}<p class="hintline" id="chint"></p></fieldset>
    <fieldset><legend>問い方</legend>${modeHtml()}</fieldset>
    <fieldset><legend>出題する範囲</legend>
     <div class="row"><button class="link" id="allOn" type="button">すべて選ぶ</button><button class="link" id="allOff" type="button">すべて外す</button></div>
     ${rangeHtml()}<p class="sum" id="sum"></p></fieldset>
    <fieldset><legend>出し方</legend>${seg("order",[["random","ランダム"],["order","順番"]],cfg.order)}<p class="hintline" id="ohint"></p></fieldset>
    <fieldset><legend>問題数</legend>${seg("n",[["10","10問"],["30","30問"],["0","選択範囲の全問"]],cfg.n)}</fieldset>
    <button class="btn" id="go" type="button">始める</button>
   </div>${statsView()}`;
  app.addEventListener("change", onCfg);
  $("#go").onclick = () => start();
  $("#allOn").onclick = () => { cfg.sheets = ALL_SHEETS.slice(); syncRange(); };
  $("#allOff").onclick = () => { cfg.sheets = []; syncRange(); };
  $("#exp").onclick = () => dialog("記録を書き出す", "下の文章をコピーして、保存してください。", JSON.stringify({stats:store.stats, rounds:store.rounds, wrong:store.wrong}), null);
  $("#imp").onclick = () => dialog("記録を読み込む", "書き出した文章を貼り付けてください。現在の記録は置き換わります。", "", "読み込む", t => {
    try { const o = JSON.parse(t); if (!o || typeof o.stats !== "object") throw 0; store.stats = o.stats; store.rounds = o.rounds||0; store.wrong = (o.wrong && typeof o.wrong === "object") ? o.wrong : seedWrong(o.stats); save(); home(); return true; } catch (e) { alert("読み込めませんでした。書き出した文章をそのまま貼り付けてください。"); return false; } });
  $("#rst").onclick = () => { if (confirm("記録をすべて消します。よろしいですか?")) { store.stats = {}; store.rounds = 0; store.pos = {}; store.wrong = {}; save(); home(); } };
  const wc = $("#wclear"); if (wc) wc.onclick = () => { if (confirm("復習リストを空にします。よろしいですか?")) { store.wrong = {}; save(); home(); } };
  syncRange(); window.scrollTo(0,0);
}
app.addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (!b) return; delete store.wrong[b.dataset.rm]; save(); home(); });
function syncRange(){
  const set = new Set(cfg.sheets);
  document.querySelectorAll('input[name=sheet]').forEach(i => i.checked = set.has(i.value));
  document.querySelectorAll('input[data-g]').forEach(h => {
    const items = GROUPS[+h.dataset.g].items.map(i => i[0]);
    const on = items.filter(s => set.has(s)).length;
    h.checked = on === items.length; h.indeterminate = on > 0 && on < items.length;
  });
  const review = cfg.course === "review";
  const total = Object.keys(store.wrong).filter(k => byKey.has(k)).length;
  const inRange = reviewList(cfg).length;
  const all = orderedList(cfg);
  const N = review ? inRange : all.length;
  const n = cfg.sheets.reduce((x,s) => x + countOf(s), 0);
  $("#sum").textContent = cfg.sheets.length ? `選択中: ${cfg.sheets.length}分野・${n}語` : "範囲を1つ以上選んでください。";
  $("#chint").textContent = review
    ? (total ? `復習リストは${total}語です。選択中の範囲では、${inRange}語が対象です。` : "復習リストはまだ空です。通常コースで間違えた用語が、ここに溜まります。")
    : "選んだ範囲の用語を出題します。";
  const lab = document.querySelector('label[for="n-0"]'); if (lab) lab.textContent = `選択範囲の全問(${N}問)`;
  $("#go").disabled = !cfg.sheets.length || N === 0;
  const oh = $("#ohint");
  if (cfg.order === "random") oh.textContent = review ? "復習リストの用語を、ランダムに出します。" : "選んだ範囲から、毎回ランダムに出します。";
  else if (review) oh.textContent = "復習リストの用語を、間違えた順(古いものから)に出します。";
  else {
    const p = all.length ? (store.pos[sig(cfg)] || 0) % all.length : 0;
    oh.innerHTML = `上の一覧と同じ並び順で出します。前回の続きから始めます(次は ${p+1}語目 / 全${all.length}語)。` + (p ? ` <button class="link" id="posreset" type="button">最初から始める</button>` : "");
    const b = $("#posreset"); if (b) b.onclick = () => { store.pos[sig(cfg)] = 0; save(); syncRange(); };
  }
  store.cfg = {course:cfg.course, mode:cfg.mode, sheets:cfg.sheets, order:cfg.order, n:cfg.n}; save();
}
function onCfg(e){
  const t = e.target;
  if (t.dataset && t.dataset.g !== undefined){
    const items = GROUPS[+t.dataset.g].items.map(i => i[0]);
    const s = new Set(cfg.sheets);
    items.forEach(x => t.checked ? s.add(x) : s.delete(x));
    cfg.sheets = ALL_SHEETS.filter(x => s.has(x));
  } else if (t.name === "sheet"){
    cfg.sheets = [...document.querySelectorAll('input[name=sheet]:checked')].map(i => i.value);
  } else if (t.name === "course") cfg.course = t.value;
  else if (t.name === "mode") cfg.mode = t.value;
  else if (t.name === "order") cfg.order = t.value;
  else if (t.name === "n") cfg.n = +t.value;
  else return;
  syncRange();
}
const newRound = qs => ({qs, i:0, ans:[], added:[], cleared:[], done:false});
function start(only){
  app.removeEventListener("change", onCfg);
  const qs = buildRound(cfg, only);
  if (!qs.length){ alert("この範囲では出題できる用語がありません。"); home(); return; }
  round = newRound(qs);
  show();
}
function card(r, cls, title){
  return `<div class="card ${cls||""}"><h3>${title?esc(title)+"：":""}${esc(r.t)}<span class="par">${esc(r.s.replace(/^D\d_/,""))}${r.p?" / "+esc(r.p):""}</span></h3>
   <dl><dt>意味</dt><dd>${esc(r.q || r.d)}</dd><dt>試験での言い回し</dt><dd>${esc(r.k)}</dd><dt>似た用語との違い</dt><dd>${esc(r.b)}</dd></dl></div>`;
}
function show(){
  const q = round.qs[round.i], total = round.qs.length;
  const r = q.row;
  const KIND_OVR = {"D1_CAF":{1:"視点",3:"能力"},"D1_Well-Architected":{1:"柱",3:"設計原則"},"D2_責任共有詳細":{3:"サービス"},"D4_サポート":{3:"サポートプラン"},"D4_購入オプション":{3:"購入オプション・種類"}};
  const KIND = (KIND_OVR[r.s] && KIND_OVR[r.s][r.l]) || ["用語・考え方","区分・用語","サービス","機能・種類","操作方法"][r.l] || "用語";
  const label = (SHEETLABEL[r.s] || r.s);
  const tags = `<div class="tags"><span>分野: ${esc(label)}</span>${r.p ? `<span>${r.l >= 3 ? "対象" : "分類"}: ${esc(r.p)}</span>` : ""}</div>`;
  const prompt = q.mode === "d"
    ? `${tags}<p class="q">次の説明に当てはまる${KIND}は、どれでしょう?</p><div class="quote">${esc(mask(r.q, r))}</div>`
    : `${tags}<p class="q">「${esc(r.t)}」の説明として、正しいのはどれでしょう?</p>`;
  app.innerHTML = `
   <div class="bar"><i style="width:${round.i/total*100}%"></i></div>
   <div class="meta"><span>${round.i+1} / ${total}問</span><button class="link" id="quit" type="button">中断する</button></div>
   <div class="panel">${prompt}
    <div class="opts" id="opts">${q.opts.map((o,i) => `<button class="opt" type="button" data-i="${i}"><span class="bub">${LABELS[i]}</span><span class="tx">${esc(o.text)}</span></button>`).join("")}</div>
    <div id="fb" hidden></div></div>`;
  $("#quit").onclick = () => { if (confirm("ここまでの結果は記録されています。ホームに戻ります。")) home(); };
  $("#opts").onclick = e => { const b = e.target.closest(".opt"); if (b && !b.disabled) answer(+b.dataset.i); };
  window.scrollTo(0,0);
}
function answer(i){
  const q = round.qs[round.i];
  const ok = i === q.correct;
  const k = rkey(q.row);
  const s = store.stats[k] || (store.stats[k] = {a:0,w:0});
  s.a++; if (!ok) s.w++;
  let note = "";
  const wv = store.wrong[k];
  if (!ok){
    store.wrong[k] = {m:(wv ? wv.m : 0) + 1, s:0, a:wv ? wv.a : Date.now(), t:Date.now()};
    if (!wv){ round.added.push(k); note = "復習リストに追加しました。"; } else note = "すでに復習リストにあります。連続正解は0回に戻ります。";
  } else if (wv){
    wv.s = (wv.s||0) + 1;
    if (wv.s >= CLEAR){ delete store.wrong[k]; round.cleared.push(k); note = `連続${CLEAR}回正解したので、復習リストから外れました。`; }
    else note = `復習リスト: 連続${wv.s}回正解。あと${CLEAR - wv.s}回でリストから外れます。`;
  }
  save();
  round.ans.push({k, ok});
  document.querySelectorAll(".opt").forEach((b,idx) => {
    b.disabled = true;
    if (idx === q.correct) { b.classList.add("ok"); b.querySelector(".bub").textContent = "○"; }
    else if (idx === i) { b.classList.add("ng"); b.querySelector(".bub").textContent = "×"; }
  });
  const last = round.i === round.qs.length - 1;
  let html = `<p class="verdict ${ok?"ok":"ng"}">${ok?"正解です":"不正解です"}</p>`;
  if (note) html += `<p class="note" style="margin:0 0 8px">${esc(note)}</p>`;
  html += card(q.row, "right", "正解");
  if (!ok && q.opts[i].row !== q.row) html += card(q.opts[i].row, "pick", "選んだもの");
  html += `<button class="btn" id="nx" type="button">${last?"結果を見る":"次の問題"}</button>`;
  const fb = $("#fb"); fb.innerHTML = html; fb.hidden = false;
  $("#nx").onclick = next; $("#nx").focus({preventScroll:true});
  fb.scrollIntoView({block:"nearest"});
}
function next(){
  if (round.i < round.qs.length - 1){ round.i++; show(); } else result();
}
function result(){
  store.rounds = (store.rounds||0) + 1; save();
  const n = round.ans.length, c = round.ans.filter(x => x.ok).length;
  const notes = [];
  if (round.added.length) notes.push(`復習リストに${round.added.length}語を追加しました。`);
  if (round.cleared.length) notes.push(`連続${CLEAR}回正解で、${round.cleared.length}語がリストから外れました。`);
  if (cfg.course === "review" && !Object.keys(store.wrong).length) notes.push("復習リストが空になりました。");
  const miss = round.ans.filter(x => !x.ok).map(x => byKey.get(x.k)).filter(Boolean);
  app.innerHTML = `<h1>結果</h1>
   <div class="panel"><p class="score">${c} / ${n}</p><p class="lead" style="margin:0">正答率 ${Math.round(c/n*100)}%</p>${notes.map(x => `<p class="note" style="margin:4px 0 0">${esc(x)}</p>`).join("")}
    <div class="row" style="margin-top:12px">
     ${miss.length ? `<button class="btn" id="again" type="button">間違えた用語だけもう一度</button>` : ""}
     <button class="btn ${miss.length?"ghost":""}" id="more" type="button">${cfg.course==="review"?"復習をもう1回":cfg.order==="order"?"続きの問題へ":"同じ設定でもう1回"}</button>
     <button class="btn ghost" id="hm" type="button">ホームに戻る</button></div></div>
   ${miss.length ? `<h2>復習する用語(${miss.length})</h2>` + miss.map(r => card(r)).join("") : `<p class="lead">全問正解です。</p>`}`;
  const a = $("#again"); if (a) a.onclick = () => { app.removeEventListener("change", onCfg); const qs = buildRound(cfg, miss.map(rkey)); round = newRound(qs); show(); };
  $("#more").onclick = () => start();
  $("#hm").onclick = home;
  window.scrollTo(0,0);
}
function dialog(title, note, text, okLabel, onOk){
  const d = $("#dlg");
  $("#dlgT").textContent = title; $("#dlgN").textContent = note; $("#dlgTa").value = text;
  $("#dlgTa").readOnly = !okLabel;
  const ok = $("#dlgOk");
  ok.textContent = okLabel || "コピーする";
  ok.onclick = () => {
    if (okLabel) { if (onOk($("#dlgTa").value)) d.close(); }
    else { const t = $("#dlgTa"); t.select(); try { navigator.clipboard.writeText(t.value); ok.textContent = "コピーしました"; } catch (e) { document.execCommand("copy"); ok.textContent = "コピーしました"; } }
  };
  $("#dlgNo").onclick = () => d.close();
  d.showModal();
}
document.addEventListener("keydown", e => {
  if (!round || document.querySelector("dialog[open]")) return;
  const n = {"1":0,"2":1,"3":2,"4":3,"ア":0}[e.key];
  const nx = $("#nx");
  if (nx && (e.key === "Enter")) { return; }
  if (n !== undefined && !nx){ const b = document.querySelectorAll(".opt")[n]; if (b && !b.disabled) answer(n); }
});
home();
